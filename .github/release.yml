changelog:
  categories:
    - title: Features
      labels:
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - urgent
    - title: Performance
      labels:
        - performance
    - title: Refactoring
      labels:
        - refactor
    - title: Documentation
      labels:
        - documentation
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - wontfix
